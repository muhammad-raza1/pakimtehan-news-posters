<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{ root }}/assets/fonts.css">
<link rel="stylesheet" href="{{ root }}/tpf/templates/tpf.css">
<style>{% block style %}{% endblock %}</style>
</head>
<body>
{% block body %}{% endblock %}
<script>
  // Shrink any [data-fit] text until it fits its max height, so long headlines never overflow.
  function fitAll() {
    document.querySelectorAll('[data-fit]').forEach(el => {
      const maxH = +el.dataset.fit, min = +(el.dataset.min || 28);
      let size = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollHeight > maxH && size > min) { size -= 2; el.style.fontSize = size + 'px'; }
    });
    document.body.dataset.ready = '1';
  }
  document.fonts.ready.then(fitAll);
</script>
</body>
</html>
