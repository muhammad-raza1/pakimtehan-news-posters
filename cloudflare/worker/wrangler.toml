# pakimtehan-posters: daily cron trigger + D1 poster storage + edit dispatcher. See worker.js.
# Deploy:   wrangler deploy
# Schema:   wrangler d1 execute pakimtehan-posters --remote --file schema.sql
# Secrets:  wrangler secret put GITHUB_TOKEN   (Actions read/write on the posters repo)
#           wrangler secret put STORE_TOKEN    (same value as GitHub secret POSTERS_STORE_TOKEN
#                                               and the server's NEWS_POSTERS_STORE_TOKEN)
name = "pakimtehan-posters"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true   # https://pakimtehan-posters.<subdomain>.workers.dev (every call needs STORE_TOKEN)

[[d1_databases]]
binding = "DB"
database_name = "pakimtehan-posters"
database_id = "5843fdc9-6667-4974-954a-05eb7611a228"

[triggers]
# Cron is in UTC. Every hour at minute 07 = 24 runs a day. Quiet hours cost almost nothing: the run stops early when
# there are fewer than `min_new_headlines` unseen headlines (config/sources.yaml).
# Every 2 hours: "7 */2 * * *".  Daytime only (06:07-22:07 Pakistan, hourly): "7 1-17 * * *".  Once a day at 07:40 Pakistan: "40 2 * * *".
# A new or changed cron takes up to 15 minutes to reach Cloudflare's network. Apply with `wrangler deploy`.
# PAUSED 17 Nov after testing; production deploy tomorrow: set back to ["7 * * * *"] and run `wrangler deploy`.
crons = ["7 * * * *"]

[observability]
enabled = true
